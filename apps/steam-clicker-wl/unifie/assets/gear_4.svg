<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="titaniumGrad" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#e0e0e0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c0c0c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#708090;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#708090;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  <!-- Outer structure -->
  <circle cx="20" cy="20" r="18" fill="#708090"/>
  <!-- Precision teeth -->
  <g fill="url(#edgeGrad)">
    <polygon points="20,2 17,0 17,4 23,4 23,0"/>
    <polygon points="35,12 38,9 34,9 34,15 38,15" transform="rotate(45 20 20)"/>
    <polygon points="38,20 40,17 36,17 36,23 40,23"/>
    <polygon points="35,28 38,31 34,31 34,25 38,25" transform="rotate(135 20 20)"/>
    <polygon points="20,38 23,40 23,36 17,36 17,40"/>
    <polygon points="5,28 2,31 6,31 6,25 2,25" transform="rotate(225 20 20)"/>
    <polygon points="2,20 0,23 4,23 4,17 0,17"/>
    <polygon points="5,12 2,9 6,9 6,15 2,15" transform="rotate(315 20 20)"/>
  </g>
  <!-- Multi-layer structure -->
  <circle cx="20" cy="20" r="14" fill="url(#titaniumGrad)" stroke="#b0c4de" stroke-width="1"/>
  <circle cx="20" cy="20" r="10" fill="#dcdcdc" stroke="#f0f8ff" stroke-width="1"/>
  <circle cx="20" cy="20" r="6" fill="#c0c0c0" stroke="#e6e6fa" stroke-width="1"/>
  <!-- High-tech center -->
  <g stroke="#4682b4" stroke-width="1" fill="#87ceeb">
    <rect x="18" y="14" width="4" height="12" rx="1"/>
    <rect x="14" y="18" width="12" height="4" rx="1"/>
    <circle cx="20" cy="20" r="2"/>
  </g>
</svg>