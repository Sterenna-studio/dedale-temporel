<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="quantumGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#ff00ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#ffff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0080;stop-opacity:1" />
    </radialGradient>
    <filter id="quantumGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Reality distortion -->
  <circle cx="20" cy="20" r="19" fill="#100010" opacity="0.9"/>
  <!-- Quantum teeth (shifting) -->
  <g filter="url(#quantumGlow)">
    <path d="M20,0 Q15,3 20,6 Q25,3 20,0" fill="#ff00ff"/>
    <path d="M35,10 Q32,5 37,8 Q40,13 35,10" fill="#00ffff" transform="rotate(45 20 20)"/>
    <path d="M40,20 Q37,15 40,20 Q37,25 40,20" fill="#ffff00"/>
    <path d="M35,30 Q40,27 37,32 Q32,35 35,30" fill="#ff0080" transform="rotate(135 20 20)"/>
    <path d="M20,40 Q25,37 20,34 Q15,37 20,40" fill="#80ff00"/>
    <path d="M5,30 Q8,35 3,32 Q0,27 5,30" fill="#0080ff" transform="rotate(225 20 20)"/>
    <path d="M0,20 Q3,25 0,20 Q3,15 0,20" fill="#ff8000"/>
    <path d="M5,10 Q0,13 3,8 Q8,5 5,10" fill="#8000ff" transform="rotate(315 20 20)"/>
  </g>
  <!-- Quantum core -->
  <circle cx="20" cy="20" r="15" fill="url(#quantumGrad)" filter="url(#quantumGlow)" opacity="0.7"/>
  <circle cx="20" cy="20" r="10" fill="#ff00ff" opacity="0.5"/>
  <circle cx="20" cy="20" r="6" fill="#00ffff" opacity="0.6"/>
  <!-- Probability center -->
  <g stroke="#ffffff" stroke-width="1" fill="none" opacity="0.8">
    <circle cx="20" cy="20" r="3" stroke-dasharray="2,2"/>
    <circle cx="20" cy="20" r="1" fill="#ffffff"/>
    <g opacity="0.5">
      <circle cx="18" cy="18" r="1" fill="#ff00ff"/>
      <circle cx="22" cy="18" r="1" fill="#00ffff"/>
      <circle cx="22" cy="22" r="1" fill="#ffff00"/>
      <circle cx="18" cy="22" r="1" fill="#ff0080"/>
    </g>
  </g>
</svg>