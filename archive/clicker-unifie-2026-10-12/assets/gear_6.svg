<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="plasmaGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#0080ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0040ff;stop-opacity:1" />
    </radialGradient>
    <filter id="plasmaGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Energy field -->
  <circle cx="20" cy="20" r="19" fill="#000033" opacity="0.6"/>
  <!-- Plasma teeth -->
  <g fill="url(#plasmaGrad)" filter="url(#plasmaGlow)">
    <path d="M20,0 L16,2 Q20,4 24,2 Q20,0 18,6 Q22,6 20,0"/>
    <path d="M38,12 L36,8 Q38,12 40,16 Q38,12 32,10 Q32,14 38,12" transform="rotate(45 20 20)"/>
    <path d="M40,20 L38,16 Q40,20 38,24 Q40,20 34,18 Q34,22 40,20"/>
    <path d="M38,28 L40,24 Q38,28 36,32 Q38,28 32,26 Q32,30 38,28" transform="rotate(135 20 20)"/>
    <path d="M20,40 L24,38 Q20,36 16,38 Q20,40 22,34 Q18,34 20,40"/>
    <path d="M2,28 L4,32 Q2,28 0,24 Q2,28 8,30 Q8,26 2,28" transform="rotate(225 20 20)"/>
    <path d="M0,20 L2,24 Q0,20 2,16 Q0,20 6,22 Q6,18 0,20"/>
    <path d="M2,12 L0,16 Q2,12 4,8 Q2,12 8,14 Q8,10 2,12" transform="rotate(315 20 20)"/>
  </g>
  <!-- Plasma core -->
  <circle cx="20" cy="20" r="16" fill="url(#plasmaGrad)" filter="url(#plasmaGlow)" opacity="0.8"/>
  <circle cx="20" cy="20" r="12" fill="#00bfff" opacity="0.7"/>
  <circle cx="20" cy="20" r="8" fill="#87ceeb" opacity="0.8"/>
  <!-- Energy nexus -->
  <g stroke="#ffffff" stroke-width="1" fill="none" opacity="0.9">
    <circle cx="20" cy="20" r="4"/>
    <circle cx="20" cy="20" r="2"/>
    <line x1="16" y1="20" x2="24" y2="20"/>
    <line x1="20" y1="16" x2="20" y2="24"/>
    <line x1="17.2" y1="17.2" x2="22.8" y2="22.8"/>
    <line x1="22.8" y1="17.2" x2="17.2" y2="22.8"/>
  </g>
</svg>